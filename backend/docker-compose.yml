# MySQL là dịch vụ database chuẩn cho môi trường phát triển.
# Schema và seed được tạo/nâng cấp bằng `python -m app.db.bootstrap`.
services:
  mysql:
    image: mysql:8.0
    container_name: ks25-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      MYSQL_DATABASE: t1shop_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 3307 trên máy -> 3306 trong container (tránh đụng MySQL đã cài trên máy ở 3306)
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
