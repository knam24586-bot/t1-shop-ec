<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T1 Shop - Redirecting...</title>
  <script>
    (function () {
      try {
        var isLoggedIn = localStorage.getItem("t1_user_logged_in") === "true";
        var params = new URLSearchParams(window.location.search);
        var page = params.get("page");

        if (page === "404" || page === "error") {
          window.location.replace("./pages/error.html");
          return;
        }

        if (isLoggedIn) {
          window.location.replace("./pages/AccountDropdownWithAccount.html");
        } else {
          window.location.replace("./pages/E-CommerceHomePage.html");
        }
      } catch (e) {
        window.location.replace("./pages/E-CommerceHomePage.html");
      }
    })();
  </script>
</head>

<body>
  <p style="text-align: center; margin-top: 50px; font-family: sans-serif;">
    Redirecting to T1 Shop... If you are not redirected, <a href="./pages/E-CommerceHomePage.html">click here</a>.
  </p>
</body>

</html>
