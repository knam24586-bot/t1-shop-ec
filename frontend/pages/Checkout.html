  <script>
    (async function () {
      const auth = window.T1ShopAuth;
      const form = document.getElementById("checkoutForm");
      const summary = document.getElementById("checkoutItems");
      const message = document.getElementById("checkoutMessage");
      const button = document.getElementById("placeOrder");
      const money = (value) => new Intl.NumberFormat("vi-VN", {style:"currency",currency:"VND"}).format(Number(value)||0);
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
      let currentCart = null;
      let submitting = false;

      function showMessage(text, type) { message.className = "checkout-message checkout-" + type; message.textContent = text; }
      function showErrorResponse(body) { const error=body?.error; if(Array.isArray(error?.details)) return error.details.map((item)=>item.message).join(" "); return error?.message || body?.detail || "Không thể hoàn tất đặt hàng."; }

      async function initialize() {
        if (!auth?.getAccessToken()) { window.location.assign("./Login.html?auth=required"); return; }
        try {
          const [userResponse, cartResponse] = await Promise.all([auth.fetch("/auth/me"), auth.fetch("/cart")]);
          if (userResponse.status === 401 || cartResponse.status === 401) { window.location.assign("./Login.html?expired=1"); return; }
          const user=await userResponse.json(); currentCart=await cartResponse.json();
          if(!userResponse.ok) throw new Error(showErrorResponse(user));
          if(!cartResponse.ok) throw new Error(showErrorResponse(currentCart));
          document.getElementById("fullName").value=user.full_name || "";
          document.getElementById("phone").value=user.phone || "";
          document.getElementById("email").value=user.email || "";
          if(!currentCart.items?.length){ summary.innerHTML='<p>Giỏ hàng đang trống.</p><a href="./Shop.html">Quay lại cửa hàng</a>'; button.disabled=true; return; }
          summary.innerHTML=currentCart.items.map((item)=>`<div class="summary-row"><span>${esc(item.product_name)} × ${Number(item.quantity)}</span><strong>${money(item.line_total)}</strong></div>`).join("")+`<div class="summary-row"><span>Thanh toán</span><strong>COD</strong></div><div class="summary-row"><strong>Tổng cộng</strong><strong>${money(currentCart.total_amount)}</strong></div>`;
        } catch(error) { showMessage(error.message || "Không kết nối được tới backend.","error"); button.disabled=true; }
      }

      form.addEventListener("submit", async function(event){
        event.preventDefault();
        if(submitting || !form.reportValidity()) return;
        if(!currentCart?.items?.length){ showMessage("Giỏ hàng đang trống.","error"); return; }
        submitting=true; button.disabled=true; button.textContent="Đang tạo đơn…";
        const shippingAddress=document.getElementById("shippingAddress").value.trim();
        try {
          const response=await auth.fetch("/orders/cod",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({shipping_address:shippingAddress})});
          const result=await response.json();
          if(!response.ok) throw new Error(showErrorResponse(result));
          const order=result.order;
          document.querySelector(".checkout-page").innerHTML=`<section class="success-panel"><h1>Đặt hàng thành công!</h1><h2>Mã đơn: ${esc(order.order_code)}</h2><p>Chúng tôi đã tiếp nhận đơn hàng COD. Bạn sẽ thanh toán khi nhận hàng.</p><p>Tổng tiền: <strong>${money(order.total_price)}</strong></p><p>Trạng thái: ${esc(order.status)}</p><a class="place-order" style="display:inline-flex;align-items:center;justify-content:center;padding:0 20px;text-decoration:none" href="./myAccount.html#my-order">Xem đơn hàng</a> <a href="./Shop.html">Tiếp tục mua sắm</a></section>`;
        } catch(error) {
          showMessage(error.message || "Đặt hàng chưa thành công. Hãy thử lại.","error");
          submitting=false; button.disabled=false; button.textContent="Đặt hàng COD";
        }
      });
      await initialize();
    })();
  </script>
