<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - TShop</title>

    <link rel="stylesheet" href="../css/login.css" />

    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
   
  </head>

  <body class="auth-page">
    <nav class="auth-quick-nav"><a href="./E-CommerceHomePage.html">T1 Shop</a><a href="./Shop.html">Shop</a><a href="./Cart.html">Cart</a></nav>

    <main class="auth-main">
      <div class="auth-layout">
        <div class="auth-visual">
          <div class="visual-circle"></div>

          <div class="visual-content">
            <div class="visual-icon">🛒</div>
            <h2>Welcome Back!</h2>
            <p>Discover amazing products at TShop.</p>
          </div>
        </div>

        <div class="auth-form">
          <h1>Log in to TShop</h1>

          <p class="auth-subtitle">Enter your details below</p>

          <form id="loginForm">
            <input
              class="auth-input"
              type="email"
              id="loginEmail"
              placeholder="Email Address"
              required
            />

            <input
              class="auth-input"
              type="password"
              id="loginPassword"
              placeholder="Password"
              required
            />

            <div class="auth-login-actions">
              <button type="submit" class="auth-btn">Log In</button>

                <a href="mailto:t1shop@gmail.com" class="auth-forgot" id="forgotPassword">
                Forget Password?
              </a>
            </div>
          </form>

          <p id="authError" class="auth-error" role="alert" hidden></p>

          <p class="auth-switch">
            Don't have an account?
            <a href="./Sign-in.html">Sign up</a>
          </p>
        </div>
      </div>
    </main>

  </body>
</html>
