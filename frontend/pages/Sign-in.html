<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up - TShop</title>

    <link rel="stylesheet" href="../css/login.css" />

    <script src="../js/api.js" defer></script>
    <script src="../js/auth.js" defer></script>
  </head>

  <body class="auth-page">
    <nav class="auth-quick-nav"><a href="./E-CommerceHomePage.html">T1 Shop</a><a href="./Shop.html">Shop</a><a href="./Cart.html">Cart</a></nav>

    <main class="auth-main">
      <div class="auth-layout">
        <div class="auth-visual">
          <div class="visual-circle"></div>

          <div class="visual-content">
            <div class="visual-icon">🛍️</div>
            <h2>Create Your Account</h2>
            <p>Join TShop and enjoy your shopping.</p>
          </div>
        </div>

        <div class="auth-form">
          <h1>Create an account</h1>

          <p class="auth-subtitle">Enter your details below</p>

          <form id="signupForm">
            <input
              class="auth-input"
              type="text"
              id="signupName"
              placeholder="Full Name"
              required
            />

            <input
              class="auth-input"
              type="email"
              id="signupEmail"
              placeholder="Email Address"
              required
            />

            <input
              class="auth-input"
              type="tel"
              id="signupPhone"
              placeholder="Phone Number"
              required
            />

            <input
              class="auth-input"
              type="password"
              id="signupPassword"
              placeholder="Password"
              minlength="8"
              required
            />

            <input
              class="auth-input"
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              minlength="8"
              required
            />

            <button type="submit" class="auth-btn auth-btn-full">
              Create Account
            </button>

          </form>

          <p id="authError" class="auth-error" role="alert" hidden></p>

          <p class="auth-switch">
            Already have account?
            <a href="./Login.html">Log in</a>
          </p>
        </div>
      </div>
    </main>

  </body>
</html>
