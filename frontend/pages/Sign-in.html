<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up - TShop</title>

    <link rel="stylesheet" href="../css/login.css" />

    <script src="../js/auth-layout.js" defer></script>
    <script src="../js/pages/signup.js" defer></script>
  </head>

  <body class="auth-page">
    <div id="site-header"></div>

    <main class="auth-main">
      <div class="auth-layout">
        <div class="auth-visual">
          <div class="visual-circle"></div>

          <div class="visual-content">
            <div class="visual-icon">🛍️</div>
            <h2>Create Your Account</h2>
            <p>Join TShop and enjoy your shopping.</p>
          </div>
        </div>

        <div class="auth-form">
          <h1>Create an account</h1>

          <p class="auth-subtitle">Enter your details below</p>

          <form id="signupForm">
            <input
              class="auth-input"
              type="text"
              id="signupName"
              placeholder="Full Name"
              required
            />

            <input
              class="auth-input"
              type="email"
              id="signupEmail"
              placeholder="Email Address"
              required
            />

            <input
              class="auth-input"
              type="tel"
              id="signupPhone"
              placeholder="Phone Number"
              required
            />

            <input
              class="auth-input"
              type="password"
              id="signupPassword"
              placeholder="Password"
              minlength="6"
              required
            />

            <input
              class="auth-input"
              type="password"
              id="confirmPassword"
              placeholder="Confirm Password"
              minlength="6"
              required
            />

            <button type="submit" class="auth-btn auth-btn-full">
              Create Account
            </button>

            <button type="button" class="auth-google-btn" id="googleSignup">
              <span class="google-letter">G</span>
              Sign up with Google
            </button>
          </form>

          <p class="auth-switch">
            Already have account?
            <a href="login.html">Log in</a>
          </p>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
